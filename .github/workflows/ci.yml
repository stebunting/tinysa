name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9].[0-9].[0-9]"

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Source Code
        run: pylint **/*.py

      - name: Run Unit Tests
        run: coverage run -m unittest discover -p "test_*.py"

      - name: Upload Test Coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-osx:
    name: Build OS X

    needs: test

    if: github.ref == 'refs/heads/production' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))

    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Executable
        run: pyinstaller tinysa.spec --noconfirm

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tinysa-osx
          path: dist/tinysa
          retention-days: 7

  build-win:
    name: Build Windows

    needs: test

    if: github.ref == 'refs/heads/production' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))

    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Executable
        run: pyinstaller tinysa.spec --noconfirm

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tinysa-win
          path: dist/tinysa.exe
          retention-days: 7

  deploy:
    name: Deploy

    needs: [build-osx, build-win]

    if: github.ref == 'refs/heads/production' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS S3
        run: |
          aws s3 cp tinysa-osx/tinysa s3://${{ secrets.AWS_S3_BUCKET_NAME }}/tinysa-osx-${GITHUB_REF_NAME#v}
          aws s3 cp tinysa-win/tinysa.exe s3://${{ secrets.AWS_S3_BUCKET_NAME }}/tinysa-win-${GITHUB_REF_NAME#v}.exe
